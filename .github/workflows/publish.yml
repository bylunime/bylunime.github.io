name: Update photographs and publish

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

concurrency:
  group: travel-journal-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out the journal
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install photo tools
        run: python -m pip install --index-url https://pypi.org/simple -r scripts/requirements.txt
      - name: Check publication boundaries
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Build the public photo collection
        env:
          DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.DRIVE_SERVICE_ACCOUNT_JSON }}
          DRIVE_PHOTO_FOLDER_ID: ${{ secrets.DRIVE_PHOTO_FOLDER_ID }}
        run: python scripts/sync_drive_photos.py --output _site
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website files only
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the journal
        id: deployment
        uses: actions/deploy-pages@v4
